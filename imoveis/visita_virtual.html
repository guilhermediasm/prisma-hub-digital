<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visita Virtual 360° Imersiva | Edifício Costa D'Oro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Three.js for 3D 360 Spherical Projection -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f7d070 0%, #d4af37 50%, #aa8010 100%);
      --bg-dark: #0a0b0e;
      --overlay-bg: rgba(10, 11, 14, 0.85);
      --border-gold: rgba(212, 175, 55, 0.3);
      --text-white: #ffffff;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-white);
    }

    /* WebGL Canvas Viewport */
    #viewer-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #viewer-container:active {
      cursor: grabbing;
    }

    /* Top HUD Header */
    .tour-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      pointer-events: none;
    }

    .tour-header > * {
      pointer-events: auto;
    }

    .property-title-badge {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      background: rgba(17, 20, 28, 0.85);
      border: 1px solid var(--border-gold);
      color: var(--gold-primary);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .back-btn:hover {
      background: var(--gold-primary);
      color: #000;
      transform: scale(1.05);
    }

    .title-meta h1 {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-meta span {
      font-size: 12px;
      color: var(--gold-primary);
      letter-spacing: 1px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-hud {
      background: rgba(17, 20, 28, 0.85);
      border: 1px solid var(--border-gold);
      color: #fff;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }

    .btn-hud:hover, .btn-hud.active {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    /* Interactive Floorplan Minimap (Top Right) */
    .minimap-card {
      position: absolute;
      top: 85px;
      right: 28px;
      background: var(--overlay-bg);
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      padding: 14px;
      z-index: 20;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      width: 200px;
      transition: all 0.3s ease;
    }

    .minimap-card.collapsed {
      transform: translateX(240px);
    }

    .minimap-toggle {
      position: absolute;
      left: -38px;
      top: 10px;
      background: var(--overlay-bg);
      border: 1px solid var(--border-gold);
      border-right: none;
      border-radius: 8px 0 0 8px;
      color: var(--gold-primary);
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .minimap-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold-primary);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .floorplan-svg-wrap {
      width: 100%;
      height: 140px;
      position: relative;
      background: #11141c;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .fp-room-pin {
      position: absolute;
      width: 14px;
      height: 14px;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid #fff;
      border-radius: 50%;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: all 0.3s;
    }

    .fp-room-pin:hover {
      background: var(--gold-primary);
      border-color: #fff;
      transform: translate(-50%, -50%) scale(1.3);
    }

    .fp-room-pin.active {
      background: var(--gold-primary);
      border-color: #fff;
      box-shadow: 0 0 15px var(--gold-primary);
      animation: pinPulse 2s infinite;
    }

    @keyframes pinPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 8px var(--gold-primary); }
      50% { transform: translate(-50%, -50%) scale(1.4); box-shadow: 0 0 18px var(--gold-primary); }
    }

    /* Hotspots in 3D Space */
    .hotspot-element {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 10;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 11, 14, 0.8);
      border: 1.5px solid var(--gold-primary);
      padding: 6px 14px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      pointer-events: none;
    }

    .hotspot-element.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .hotspot-element:hover {
      background: var(--gold-gradient);
      color: #000;
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
    }

    .hotspot-icon {
      font-size: 14px;
    }

    .hotspot-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Bottom Room Navigator Thumbnails */
    .bottom-nav {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: var(--overlay-bg);
      border: 1px solid var(--border-gold);
      border-radius: 20px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
      max-width: 90vw;
      overflow-x: auto;
    }

    .room-thumb-btn {
      background: #151822;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .room-thumb-btn:hover {
      border-color: var(--gold-primary);
      transform: translateY(-2px);
    }

    .room-thumb-btn.active {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.15);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
    }

    .room-thumb-img {
      width: 72px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }

    .room-thumb-label {
      font-size: 11px;
      font-weight: 600;
      color: #e5e7eb;
      padding: 0 4px 2px;
      white-space: nowrap;
    }

    .room-thumb-btn.active .room-thumb-label {
      color: var(--gold-primary);
      font-weight: 700;
    }

    /* Floating CTA / Broker WhatsApp Badge */
    .broker-cta-card {
      position: absolute;
      bottom: 24px;
      right: 28px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--overlay-bg);
      border: 1px solid rgba(37, 211, 102, 0.4);
      padding: 10px 18px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      text-decoration: none;
      color: #fff;
      transition: all 0.2s;
    }

    .broker-cta-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(37, 211, 102, 0.3);
      border-color: #25d366;
    }

    .broker-thumb-mini {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #25d366;
    }

    .broker-cta-text h4 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .broker-cta-text p {
      font-size: 11px;
      color: #25d366;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Screen Fade Transition */
    .fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out;
    }

    .fade-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Instructions Toast */
    .instruction-toast {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 11, 14, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 12px;
      color: #d1d5db;
      z-index: 20;
      backdrop-filter: blur(8px);
      pointer-events: none;
      animation: fadeOutToast 4s forwards;
      animation-delay: 3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes fadeOutToast {
      to { opacity: 0; transform: translate(-50%, -10px); }
    }

    @media (max-width: 900px) {
      .minimap-card { display: none; }
      .broker-cta-card { display: none; }
      .bottom-nav { width: 95vw; justify-content: flex-start; }
    }
  </style>
</head>
<body>

  <!-- WebGL Three.js Container -->
  <div id="viewer-container"></div>
  <div class="fade-overlay" id="fadeOverlay"></div>

  <!-- Instruction Hint -->
  <div class="instruction-toast">
    <span>🔄</span> Arraste com o mouse ou dedo para girar 360° em qualquer direção
  </div>

  <!-- Top Header -->
  <header class="tour-header">
    <div class="property-title-badge">
      <a href="estante_virtual.html" class="back-btn" title="Voltar para a Estante">←</a>
      <div class="title-meta">
        <h1>Edifício Costa D'Oro <span>· 360° VIP</span></h1>
        <span id="currentRoomTitle">Living Integrado & Estar</span>
      </div>
    </div>

    <div class="header-controls">
      <button class="btn-hud" id="btnAutoRotate" onclick="toggleAutoRotate()">
        <span id="rotateIcon">🔄</span> <span id="rotateText">Giro Automático</span>
      </button>
      <button class="btn-hud" onclick="toggleFullscreen()">
        ⛶ Tela Cheia
      </button>
    </div>
  </header>

  <!-- Interactive 2D Floorplan Minimap -->
  <div class="minimap-card" id="minimapCard">
    <div class="minimap-toggle" onclick="toggleMinimap()">🗺️</div>
    <div class="minimap-title">
      <span>Planta Baixa</span>
      <span style="font-size: 10px; color: #9ca3af;">240 m²</span>
    </div>
    
    <div class="floorplan-svg-wrap">
      <!-- Minimalist Architectural Floorplan Mockup -->
      <svg width="100%" height="100%" viewBox="0 0 200 140" style="background: #0d1017;">
        <!-- Walls -->
        <rect x="10" y="10" width="180" height="120" fill="none" stroke="#2a3346" stroke-width="2"/>
        <line x1="85" y1="10" x2="85" y2="130" stroke="#2a3346" stroke-width="1.5"/>
        <line x1="10" y1="75" x2="85" y2="75" stroke="#2a3346" stroke-width="1.5"/>
        <line x1="85" y1="80" x2="190" y2="80" stroke="#2a3346" stroke-width="1.5"/>
        <!-- Room Labels in Map -->
        <text x="45" y="45" fill="#586782" font-size="9" text-anchor="middle" font-weight="600">LIVING</text>
        <text x="45" y="105" fill="#586782" font-size="8" text-anchor="middle" font-weight="600">VARANDA</text>
        <text x="135" y="45" fill="#586782" font-size="8" text-anchor="middle" font-weight="600">SUÍTE MASTER</text>
        <text x="135" y="110" fill="#586782" font-size="8" text-anchor="middle" font-weight="600">COZINHA</text>
      </svg>

      <!-- Pins for Each Room on Minimap -->
      <div class="fp-room-pin active" style="top: 40px; left: 45px;" onclick="switchRoom(0)" title="Living Integrado"></div>
      <div class="fp-room-pin" style="top: 105px; left: 45px;" onclick="switchRoom(1)" title="Varanda Gourmet"></div>
      <div class="fp-room-pin" style="top: 45px; left: 135px;" onclick="switchRoom(2)" title="Suíte Master"></div>
      <div class="fp-room-pin" style="top: 110px; left: 135px;" onclick="switchRoom(3)" title="Cozinha Ilha"></div>
      <div class="fp-room-pin" style="top: 75px; left: 170px;" onclick="switchRoom(4)" title="Banheiro Spa"></div>
    </div>
  </div>

  <!-- Interactive 3D Hotspot Button Overlay -->
  <div class="hotspot-element" id="hotspotBtn" onclick="onHotspotClick()">
    <span class="hotspot-icon">🚪</span>
    <span class="hotspot-text" id="hotspotLabel">Ir para a Varanda Gourmet</span>
  </div>

  <!-- Bottom Room Thumbnails Selector -->
  <nav class="bottom-nav" id="bottomRoomNav">
    <!-- Rendered via JS -->
  </nav>

  <!-- Broker Direct WhatsApp Widget -->
  <a href="https://wa.me/5527999999999?text=Ol%C3%A1%20Guilherme!%20Fiz%20o%20Tour%20Virtual%20360%20no%20Edif%C3%ADcio%20Costa%20D'Oro%20e%20gostaria%20de%20agendar%20uma%20visita%20presencial." target="_blank" class="broker-cta-card">
    <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=100&q=80" alt="Guilherme" class="broker-thumb-mini">
    <div class="broker-cta-text">
      <h4>Guilherme Dias</h4>
      <p>💬 Agendar Visita Presencial</p>
    </div>
  </a>

  <script>
    // ROOM DATA WITH 360 PANORAMIC TEXTURES
    const rooms = [
      {
        id: 0,
        title: "Living Integrado & Estar",
        sub: "Pé-direito duplo, automação de iluminação e piso em porcelanato 120x120.",
        // High quality luxury living room interior
        texture: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=2000&q=85",
        thumb: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=150&q=80",
        hotspot: { targetRoom: 1, label: "Ir para a Varanda Gourmet", lon: 45, lat: -5 }
      },
      {
        id: 1,
        title: "Varanda Gourmet Frente Mar",
        sub: "Vista definitiva para a orla da Praia da Costa com bancada em granito e churrasqueira.",
        texture: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=2000&q=85",
        thumb: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=150&q=80",
        hotspot: { targetRoom: 3, label: "Ir para a Cozinha com Ilha", lon: 180, lat: -10 }
      },
      {
        id: 2,
        title: "Suíte Master com Closet",
        sub: "Espaço para cama super king, isolamento acústico e persianas blackout automatizadas.",
        texture: "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=2000&q=85",
        thumb: "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=150&q=80",
        hotspot: { targetRoom: 4, label: "Conhecer Banheiro Spa", lon: 90, lat: -5 }
      },
      {
        id: 3,
        title: "Cozinha Gourmet em Ilha",
        sub: "Cooktop embutido, marcenaria planejada premium e integração visual com o living.",
        texture: "https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=2000&q=85",
        thumb: "https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=150&q=80",
        hotspot: { targetRoom: 0, label: "Voltar para o Living", lon: -60, lat: 0 }
      },
      {
        id: 4,
        title: "Banheiro Spa & Hidromassagem",
        sub: "Bancada dupla em mármore Crema Marfil, banheira de imersão e acabamentos dourados.",
        texture: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=2000&q=85",
        thumb: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=150&q=80",
        hotspot: { targetRoom: 2, label: "Voltar para Suíte Master", lon: 120, lat: -8 }
      }
    ];

    let currentRoomIndex = 0;
    let isAutoRotating = true;

    // THREE.JS SETUP
    const container = document.getElementById('viewer-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Sphere Geometry (inverted normals so we look inside)
    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1);

    const textureLoader = new THREE.TextureLoader();
    let sphereMaterial = new THREE.MeshBasicMaterial();
    const sphereMesh = new THREE.Mesh(geometry, sphereMaterial);
    scene.add(sphereMesh);

    // Camera Navigation Coordinates
    let lon = 0, lat = 0;
    let phi = 0, theta = 0;
    let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
    let onPointerDownLon = 0, onPointerDownLat = 0;
    let isUserInteracting = false;

    // Load Initial Texture
    loadRoomTexture(rooms[0].texture);

    function loadRoomTexture(url) {
      textureLoader.load(url, function (texture) {
        texture.minFilter = THREE.LinearFilter;
        sphereMaterial.map = texture;
        sphereMaterial.needsUpdate = true;
      });
    }

    // Render Bottom Room Selector
    const bottomNav = document.getElementById('bottomRoomNav');
    rooms.forEach((r, idx) => {
      const btn = document.createElement('button');
      btn.className = `room-thumb-btn ${idx === 0 ? 'active' : ''}`;
      btn.onclick = () => switchRoom(idx);
      btn.innerHTML = `
        <img src="${r.thumb}" alt="${r.title}" class="room-thumb-img">
        <span class="room-thumb-label">${r.title.split('&')[0]}</span>
      `;
      bottomNav.appendChild(btn);
    });

    // Switch Room Logic
    function switchRoom(index) {
      if (index === currentRoomIndex) return;
      
      const fade = document.getElementById('fadeOverlay');
      fade.classList.add('active');

      setTimeout(() => {
        currentRoomIndex = index;
        const room = rooms[index];
        
        loadRoomTexture(room.texture);
        document.getElementById('currentRoomTitle').innerText = room.title;

        // Update Nav Buttons
        document.querySelectorAll('.room-thumb-btn').forEach((b, i) => {
          b.classList.toggle('active', i === index);
        });

        // Update Minimap Pins
        document.querySelectorAll('.fp-room-pin').forEach((pin, i) => {
          pin.classList.toggle('active', i === index);
        });

        // Update Hotspot Target
        updateHotspot(room.hotspot);

        setTimeout(() => {
          fade.classList.remove('active');
        }, 300);
      }, 400);
    }

    // 3D Hotspot Positioning
    const hotspotBtn = document.getElementById('hotspotBtn');
    let activeHotspotTarget = 1;

    function updateHotspot(hotspot) {
      if (!hotspot) {
        hotspotBtn.classList.remove('visible');
        return;
      }
      activeHotspotTarget = hotspot.targetRoom;
      document.getElementById('hotspotLabel').innerText = hotspot.label;
      hotspotBtn.classList.add('visible');
    }

    function onHotspotClick() {
      switchRoom(activeHotspotTarget);
    }

    // Position hotspot overlay in 2D Screen space based on 3D spherical angles
    function updateHotspotScreenPosition() {
      const room = rooms[currentRoomIndex];
      if (!room.hotspot) return;

      const targetLon = room.hotspot.lon;
      const targetLat = room.hotspot.lat;

      // Spherical to 3D Cartesian
      const hPhi = THREE.MathUtils.degToRad(90 - targetLat);
      const hTheta = THREE.MathUtils.degToRad(targetLon);

      const hVec = new THREE.Vector3(
        500 * Math.sin(hPhi) * Math.cos(hTheta),
        500 * Math.cos(hPhi),
        500 * Math.sin(hPhi) * Math.sin(hTheta)
      );

      // Check if point is in front of camera
      const vector = hVec.clone().project(camera);
      if (vector.z < 1) {
        const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
        hotspotBtn.style.left = x + 'px';
        hotspotBtn.style.top = y + 'px';
        hotspotBtn.classList.add('visible');
      } else {
        hotspotBtn.classList.remove('visible');
      }
    }

    // Controls & Mouse/Touch Listeners
    container.addEventListener('pointerdown', onPointerDown);
    document.addEventListener('wheel', onDocumentMouseWheel);
    window.addEventListener('resize', onWindowResize);

    function onPointerDown(event) {
      if (event.isPrimary === false) return;
      isUserInteracting = true;
      isAutoRotating = false;
      document.getElementById('rotateIcon').innerText = '▶️';
      document.getElementById('rotateText').innerText = 'Giro Parado';

      onPointerDownPointerX = event.clientX;
      onPointerDownPointerY = event.clientY;
      onPointerDownLon = lon;
      onPointerDownLat = lat;

      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
    }

    function onPointerMove(event) {
      if (event.isPrimary === false) return;
      lon = (onPointerDownPointerX - event.clientX) * 0.15 + onPointerDownLon;
      lat = (event.clientY - onPointerDownPointerY) * 0.15 + onPointerDownLat;
    }

    function onPointerUp(event) {
      if (event.isPrimary === false) return;
      isUserInteracting = false;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
    }

    function onDocumentMouseWheel(event) {
      const fov = camera.fov + event.deltaY * 0.05;
      camera.fov = THREE.MathUtils.clamp(fov, 35, 95);
      camera.updateProjectionMatrix();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function toggleAutoRotate() {
      isAutoRotating = !isAutoRotating;
      document.getElementById('rotateIcon').innerText = isAutoRotating ? '🔄' : '▶️';
      document.getElementById('rotateText').innerText = isAutoRotating ? 'Giro Automático' : 'Giro Parado';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function toggleMinimap() {
      document.getElementById('minimapCard').classList.toggle('collapsed');
    }

    // MAIN ANIMATION LOOP (60FPS)
    function animate() {
      requestAnimationFrame(animate);

      if (isAutoRotating && !isUserInteracting) {
        lon += 0.12; // Smooth cinematic rotation
      }

      lat = Math.max(-85, Math.min(85, lat));
      phi = THREE.MathUtils.degToRad(90 - lat);
      theta = THREE.MathUtils.degToRad(lon);

      const target = new THREE.Vector3();
      target.x = 500 * Math.sin(phi) * Math.cos(theta);
      target.y = 500 * Math.cos(phi);
      target.z = 500 * Math.sin(phi) * Math.sin(theta);

      camera.lookAt(target);
      renderer.render(scene, camera);

      updateHotspotScreenPosition();
    }

    // Initialize first hotspot & start 60fps render
    updateHotspot(rooms[0].hotspot);
    animate();
  </script>
</body>
</html>
